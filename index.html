<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fábrica de Guiones IA</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101827;color:#fff;font-family:Arial,sans-serif}
.container{max-width:750px;margin:auto}
h1{text-align:center;color:blue}
.sub{text-align:center;color:#bdc8d8;margin-bottom:25px}
.panel{background:#1c293b;padding:20px;border-radius:15px}
label{display:block;margin:15px 0 7px;font-weight:bold}
input,select,textarea{width:100%;padding:13px;border:1px solid #40516a;border-radius:8px;background:#101827;color:white;font-size:16px}
textarea{min-height:100px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{padding:14px;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:0.6;cursor:not-allowed}
.generate{width:100%;margin-top:22px;background:#61e6a5;color:#102018}
.secondary{background:#34445c;color:white;margin:5px 5px 5px 0}
#resultado{white-space:pre-wrap;line-height:1.6;background:#101827;padding:15px;border-radius:9px;min-height:80px;overflow-wrap:anywhere}
#estado{text-align:center;color:#61e6a5;margin:15px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <h1>🏭 Fábrica de Guiones IA</h1>
  <p class="sub">Crea guiones virales con inteligencia artificial</p>

  <div class="panel">
    <label for="tipo">Categoría del guion</label>
    <select id="tipo">
      <option value="Terror y humor">Terror y humor</option>
      <option value="Motivación">Motivación</option>
      <option value="Reflexiones de amor">Reflexiones de amor</option>
      <option value="Finanzas personales">Finanzas personales</option>
      <option value="Historias bíblicas">Historias bíblicas</option>
      <option value="Noticias">Noticias</option>
      <option value="Carpintería">Carpintería</option>
      <option value="Personalizado">Personalizado</option>
    </select>

    <label for="modo">Modo de creación</label>
    <select id="modo">
      <option value="Con indicaciones visuales">Con indicaciones visuales</option>
      <option value="Monólogo narrado">Monólogo narrado</option>
    </select>

    <label for="tema">Tema o idea del guion</label>
    <textarea id="tema" placeholder="Escribe aquí la historia o el tema que quieres desarrollar..."></textarea>

    <div class="grid">
      <div>
        <label for="duracion">Duración</label>
        <select id="duracion">
          <option value="30 segundos">30 segundos</option>
          <option value="60 segundos" selected>60 segundos</option>
          <option value="90 segundos">90 segundos</option>
          <option value="2 minutos">2 minutos</option>
          <option value="3 minutos">3 minutos</option>
          <option value="5 minutos">5 minutos</option>
        </select>
      </div>
      <div>
        <label for="cantidad">Cantidad de guiones</label>
        <select id="cantidad">
          <option value="1">1</option>
          <option value="3">3</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </div>
      <div>
        <label for="estilo">Estilo</label>
        <select id="estilo">
          <option value="Viral">Viral</option>
          <option value="Cinematográfico">Cinematográfico</option>
          <option value="Emocional">Emocional</option>
          <option value="Humorístico">Humorístico</option>
          <option value="Documental">Documental</option>
          <option value="Inspirador">Inspirador</option>
          <option value="Conversacional">Conversacional</option>
        </select>
      </div>
      <div>
        <label for="plataforma">Plataforma</label>
        <select id="plataforma">
          <option value="Todas">Todas</option>
          <option value="YouTube Shorts">YouTube Shorts</option>
          <option value="Facebook Reels">Facebook Reels</option>
          <option value="TikTok">TikTok</option>
          <option value="YouTube videos largos">YouTube videos largos</option>
        </select>
      </div>
      <div>
        <label for="caracteres">Extensión</label>
        <select id="caracteres">
          <option value="Sin límite">Sin límite</option>
          <option value="300 caracteres">300 caracteres</option>
          <option value="500 caracteres">500 caracteres</option>
          <option value="800 caracteres">800 caracteres</option>
          <option value="1000 caracteres">1000 caracteres</option>
          <option value="1500 caracteres">1500 caracteres</option>
          <option value="2000 caracteres">2000 caracteres</option>
        </select>
      </div>
      <div>
        <label for="trozos">Dividir en trozos</label>
        <select id="trozos">
          <option value="Sin dividir">Sin dividir</option>
          <option value="2 trozos">2 trozos</option>
          <option value="3 trozos">3 trozos</option>
          <option value="4 trozos">4 trozos</option>
          <option value="5 trozos">5 trozos</option>
          <option value="6 trozos">6 trozos</option>
          <option value="9 trozos">9 trozos</option>
        </select>
      </div>
    </div>

    <button class="generate" id="generar" onclick="generarGuiones()">✨ GENERAR GUIONES</button>
    <p id="estado" aria-live="polite"></p>

    <h3>📜 Tus guiones</h3>
    <div id="resultado">Aquí aparecerán los guiones que genere la inteligencia artificial.</div>
    <button class="secondary" id="btn-copiar" onclick="copiar()">📋 Copiar</button>
    <button class="secondary" id="btn-descargar" onclick="descargar()">⬇️ Descargar TXT</button>
  </div>
</div>

<script>
const API_URL = "https://fabrica-guiones-api.herreraizamar19.workers.dev";
const MENSAJE_INICIAL = "Aquí aparecerán los guiones que genere la inteligencia artificial.";
let hayGuionesGenerados = false;

async function generarGuiones() {
  const tema = document.getElementById("tema").value.trim();
  const estado = document.getElementById("estado");
  const boton = document.getElementById("generar");
  const btnCopiar = document.getElementById("btn-copiar");
  const btnDescargar = document.getElementById("btn-descargar");
  const resultado = document.getElementById("resultado");

  if (!tema) {
    alert("Primero escribe el tema del guion.");
    document.getElementById("tema").focus();
    return;
  }

  const datos = {
    tipo: document.getElementById("tipo").value,
    modo: document.getElementById("modo").value,
    tema: tema,
    duracion: document.getElementById("duracion").value,
    cantidad: document.getElementById("cantidad").value,
    estilo: document.getElementById("estilo").value,
    plataforma: document.getElementById("plataforma").value,
    caracteres: document.getElementById("caracteres").value,
    trozos: document.getElementById("trozos").value
  };

  boton.disabled = true;
  btnCopiar.disabled = true;
  btnDescargar.disabled = true;
  boton.textContent = "GENERANDO...";
  estado.textContent = "⏳ La inteligencia artificial está escribiendo...";
  resultado.textContent = "";
  hayGuionesGenerados = false;

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 75000);

  try {
    const respuesta = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datos),
      signal: controller.signal
    });

    const textoCrudo = await respuesta.text();
    let contenido = {};

    try {
      contenido = textoCrudo ? JSON.parse(textoCrudo) : {};
    } catch {
      throw new Error("El servidor no devolvió un JSON válido.");
    }

    if (!respuesta.ok) {
      throw new Error(contenido.error || `Error HTTP ${respuesta.status}`);
    }

    const textoFinal = (contenido.texto || "").trim();
    if (!textoFinal) {
      resultado.textContent = "No se recibió ningún guion.";
      estado.textContent = "⚠️ La respuesta llegó vacía.";
      return;
    }

    resultado.textContent = textoFinal;
    hayGuionesGenerados = true;
    estado.textContent = "✅ ¡Tus guiones están listos!";
  } catch (error) {
    estado.textContent = "❌ No se pudo completar la solicitud.";
    if (error.name === "AbortError") {
      resultado.textContent = "Error: La solicitud tardó demasiado tiempo.";
    } else {
      resultado.textContent = "Error: " + error.message;
    }
  } finally {
    clearTimeout(timeoutId);
    boton.disabled = false;
    btnCopiar.disabled = false;
    btnDescargar.disabled = false;
    boton.textContent = "✨ GENERAR GUIONES";
  }
}

function copiar() {
  const texto = document.getElementById("resultado").textContent.trim();
  if (!hayGuionesGenerados || !texto || texto === MENSAJE_INICIAL) {
    alert("Primero genera un guion para poder copiarlo.");
    return;
  }

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto)
      .then(() => alert("¡Texto copiado!"))
      .catch(() => alert("No se pudo copiar. Selecciona el texto manualmente."));
  } else {
    alert("No se pudo copiar automáticamente. Selecciona el texto manualmente.");
  }
}

function descargar() {
  const texto = document.getElementById("resultado").textContent.trim();
  if (!hayGuionesGenerados || !texto || texto === MENSAJE_INICIAL) {
    alert("Primero genera un guion para poder descargarlo.");
    return;
  }

  const archivo = new Blob([texto], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(archivo);
  const enlace = document.createElement("a");
  enlace.href = url;
  enlace.download = "mis-guiones.txt";
  document.body.appendChild(enlace);
  enlace.click();
  document.body.removeChild(enlace);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
</script>
</body>
</html>
