
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fábrica de Guiones IA</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101827;color:#fff;font-family:Arial,sans-serif}
.container{max-width:750px;margin:auto}
h1{text-align:center;color:#61e6a5}
.sub{text-align:center;color:#bdc8d8;margin-bottom:25px}
.panel{background:#1c293b;padding:20px;border-radius:15px}
label{display:block;margin:15px 0 7px;font-weight:bold}
input,select,textarea{width:100%;padding:13px;border:1px solid #40516a;border-radius:8px;background:#101827;color:white;font-size:16px}
textarea{min-height:100px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{padding:14px;border:0;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}
.generate{width:100%;margin-top:22px;background:#61e6a5;color:#102018}
.secondary{background:#34445c;color:white;margin:5px 5px 5px 0}
#resultado{white-space:pre-wrap;line-height:1.6;background:#101827;padding:15px;border-radius:9px;min-height:80px;overflow-wrap:anywhere}
#estado{text-align:center;color:#61e6a5;margin:15px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>🏭 Fábrica de Guiones IA</h1>
<p class="sub">Crea guiones virales con inteligencia artificial</p>

<div class="panel">
<label for="tipo">Categoría del guion</label>
<select id="tipo">
<option>Terror y humor</option>
<option>Motivación</option>
<option>Reflexiones de amor</option>
<option>Finanzas personales</option>
<option>Historias bíblicas</option>
<option>Noticias</option>
<option>Carpintería</option>
<option>Personalizado</option>
</select>

<label for="modo">Modo de creación</label>
<select id="modo">
  <option>Con indicaciones visuales</option>
  <option>Monólogo narrado</option>
</select>

<label for="tema">Tema o idea del guion</label>
<textarea id="tema" placeholder="Escribe aquí la historia o el tema que quieres desarrollar..."></textarea>

<div class="grid">
<div>
<label for="duracion">Duración</label>
<select id="duracion">
<option>30 segundos</option>
<option selected>60 segundos</option>
<option>90 segundos</option>
<option>2 minutos</option>
<option>3 minutos</option>
<option>5 minutos</option>
</select>
</div>
<div>
<label for="cantidad">Cantidad de guiones</label>
<select id="cantidad">
<option>1</option><option>3</option><option>5</option>
<option>10</option><option>15</option><option>20</option>
</select>
</div>
<div>
<label for="estilo">Estilo</label>
<select id="estilo">
<option>Viral</option>
<option>Cinematográfico</option>
<option>Emocional</option>
<option>Humorístico</option>
<option>Documental</option>
<option>Inspirador</option>
<option>Conversacional</option>
</select>
</div>
<div>
<label for="plataforma">Plataforma</label>
<select id="plataforma">
<option>Todas</option>
<option>YouTube Shorts</option>
<option>Facebook Reels</option>
<option>TikTok</option>
<option>YouTube videos largos</option>
</select>
</div>
<div>
<label for="caracteres">Extensión</label>
<select id="caracteres">
<option>Sin límite</option>
<option>300 caracteres</option>
<option>500 caracteres</option>
<option>800 caracteres</option>
<option>1000 caracteres</option>
<option>1500 caracteres</option>
<option>2000 caracteres</option>
</select>
</div>
<div>
<label for="trozos">Dividir en trozos</label>
<select id="trozos">
<option>Sin dividir</option>
<option>2 trozos</option>
<option>3 trozos</option>
<option>4 trozos</option>
<option>5 trozos</option>
<option>6 trozos</option>
<option>9 trozos</option>
</select>
</div>
</div>

<button class="generate" id="generar" onclick="generarGuiones()">✨ GENERAR GUIONES</button>
<p id="estado"></p>

<h3>📜 Tus guiones</h3>
<div id="resultado">Aquí aparecerán los guiones que genere la inteligencia artificial.</div>
<button class="secondary" onclick="copiar()">📋 Copiar</button>
<button class="secondary" onclick="descargar()">⬇️ Descargar TXT</button>
</div>
</div>

<script>
const API_URL = "https://fabrica-guiones-api.herreraizamar19.workers.dev";

async function generarGuiones(){
  const tema = document.getElementById("tema").value.trim();
  const estado = document.getElementById("estado");
  const boton = document.getElementById("generar");
  const resultado = document.getElementById("resultado");

  if(!tema){
    alert("Primero escribe el tema del guion.");
    return;
  }

  const datos = {
    tipo: document.getElementById("tipo").value,
    modo: document.getElementById("modo").value,
    tema: tema,
    duracion: document.getElementById("duracion").value,
    cantidad: document.getElementById("cantidad").value,
    estilo: document.getElementById("estilo").value,
    plataforma: document.getElementById("plataforma").value,
    caracteres: document.getElementById("caracteres").value,
    trozos: document.getElementById("trozos").value
  };

  boton.disabled = true;
  boton.textContent = "GENERANDO...";
  estado.textContent = "⏳ La inteligencia artificial está escribiendo...";
  resultado.textContent = "";

  try{
    const respuesta = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(datos)
    });

    const contenido = await respuesta.json();

    if(!respuesta.ok){
      throw new Error(contenido.error || "No se pudo generar el guion.");
    }

    resultado.textContent = contenido.texto || "No se recibió ningún guion.";
    estado.textContent = "✅ ¡Tus guiones están listos!";
  }catch(error){
    estado.textContent = "❌ No se pudo completar la solicitud.";
    resultado.textContent = "Error: " + error.message;
  }finally{
    boton.disabled = false;
    boton.textContent = "✨ GENERAR GUIONES";
  }
}

function copiar(){
  const texto = document.getElementById("resultado").textContent;
  if(!texto.trim()){
    alert("No hay texto para copiar.");
    return;
  }
  navigator.clipboard.writeText(texto)
    .then(()=>alert("¡Texto copiado!"))
    .catch(()=>alert("No se pudo copiar. Selecciona el texto manualmente."));
}

function descargar(){
  const texto = document.getElementById("resultado").textContent;
  const archivo = new Blob([texto],{type:"text/plain;charset=utf-8"});
  const enlace = document.createElement("a");
  enlace.href = URL.createObjectURL(archivo);
  enlace.download = "mis-guiones.txt";
  enlace.click();
  URL.revokeObjectURL(enlace.href);
}
</script>
</body>
</html>
