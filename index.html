
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fábrica de Guiones IA</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #101827;
    color: #fff;
}

.container {
    max-width: 850px;
    margin: auto;
    background: #1c293b;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 8px 30px #0005;
}

h1 {
    text-align: center;
    color: #55d6be;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #b8c5d6;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 16px;
    margin-bottom: 7px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #42536a;
    border-radius: 9px;
    background: #101827;
    color: white;
    font-size: 15px;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.generate {
    width: 100%;
    margin-top: 24px;
    background: #55d6be;
    color: #10202a;
}

.generate:disabled {
    opacity: .6;
    cursor: wait;
}

.secondary {
    background: #33465e;
    color: white;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.actions button {
    flex: 1;
}

#resultado {
    min-height: 180px;
    margin-top: 20px;
    white-space: pre-wrap;
    line-height: 1.7;
    padding: 18px;
    border-radius: 10px;
    background: #101827;
    border: 1px solid #42536a;
    overflow-wrap: anywhere;
}

#estado {
    text-align: center;
    margin-top: 15px;
    color: #55d6be;
}

.footer {
    text-align: center;
    color: #8798ac;
    font-size: 12px;
    margin-top: 25px;
}

@media(max-width:600px) {
    .grid {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .container {
        padding: 18px;
    }

    .actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Fábrica de Guiones IA</h1>
<p class="subtitle">Crea guiones para tus redes sociales con inteligencia artificial.</p>

<label for="tipo">Categoría del contenido</label>
<select id="tipo">
    <option>Motivación</option>
    <option>Finanzas personales</option>
    <option>Historias de terror</option>
    <option>Amor y reflexión</option>
    <option>Consejos de vida</option>
    <option>Humor</option>
    <option>Noticias</option>
    <option>Historias bíblicas</option>
    <option>Personalizado</option>
</select>

<label for="tema">Tema del guion</label>
<textarea id="tema" placeholder="Escribe el tema que quieres desarrollar..."></textarea>

<div class="grid">

<div>
<label for="duracion">Duración</label>
<select id="duracion">
    <option value="15 segundos">15 segundos</option>
    <option value="30 segundos" selected>30 segundos</option>
    <option value="45 segundos">45 segundos</option>
    <option value="60 segundos">60 segundos</option>
    <option value="90 segundos">90 segundos</option>
    <option value="2 minutos">2 minutos</option>
    <option value="3 minutos">3 minutos</option>
    <option value="5 minutos">5 minutos</option>
    <option value="10 minutos">10 minutos</option>
</select>
</div>

<div>
<label for="cantidad">Cantidad de guiones</label>
<select id="cantidad">
    <option value="1">1 guion</option>
    <option value="2">2 guiones</option>
    <option value="3">3 guiones</option>
    <option value="5">5 guiones</option>
</select>
</div>

<div>
<label for="estilo">Estilo de narración</label>
<select id="estilo">
    <option>Emocional</option>
    <option>Motivacional</option>
    <option>Cinematográfico</option>
    <option>Profesional</option>
    <option>Misterioso</option>
    <option>Humorístico</option>
    <option>Reflexivo</option>
    <option>Impactante</option>
</select>
</div>

<div>
<label for="plataforma">Plataforma</label>
<select id="plataforma">
    <option>YouTube Shorts</option>
    <option>YouTube videos largos</option>
    <option>Facebook Reels</option>
    <option>TikTok</option>
    <option>Instagram Reels</option>
</select>
</div>

<div>
<label for="caracteres">Cantidad aproximada de caracteres</label>
<select id="caracteres">
    <option value="300">300 caracteres</option>
    <option value="500">500 caracteres</option>
    <option value="800" selected>800 caracteres</option>
    <option value="1000">1000 caracteres</option>
    <option value="1500">1500 caracteres</option>
    <option value="2000">2000 caracteres</option>
    <option value="3000">3000 caracteres</option>
    <option value="5000">5000 caracteres</option>
</select>
</div>

<div>
<label for="trozos">Dividir en trozos</label>
<select id="trozos">
    <option value="1">Sin dividir</option>
    <option value="2">2 trozos</option>
    <option value="3">3 trozos</option>
    <option value="4">4 trozos</option>
    <option value="5">5 trozos</option>
    <option value="6">6 trozos</option>
    <option value="7">7 trozos</option>
    <option value="8">8 trozos</option>
    <option value="9">9 trozos</option>
</select>
</div>

</div>

<label for="modo">Modo de creación</label>
<select id="modo">
    <option value="Monólogo narrado">Monólogo narrado (solo narración)</option>
    <option value="Con indicaciones visuales">Guion con indicaciones visuales</option>
</select>

<button class="generate" id="generar" onclick="generarGuion()">
    ✨ GENERAR GUION
</button>

<div id="estado"></div>

<label>Resultado del guion</label>
<div id="resultado">Aquí aparecerán tus guiones...</div>

<div class="actions">
    <button class="secondary" onclick="copiar()">📋 Copiar</button>
    <button class="secondary" onclick="descargar()">⬇ Descargar TXT</button>
</div>

<div class="footer">
    Fábrica de Guiones IA · Crea contenido con inteligencia artificial
</div>

</div>

<script>
const API_URL = "https://fabrica-guiones-api.herreraizamar19.workers.dev";

async function generarGuion() {

    const tema = document.getElementById("tema").value.trim();

    if (!tema) {
        alert("Escribe primero el tema de tu guion.");
        return;
    }

    const boton = document.getElementById("generar");
    const estado = document.getElementById("estado");
    const resultado = document.getElementById("resultado");

    const datos = {
        tipo: document.getElementById("tipo").value,
        modo: document.getElementById("modo").value,
        tema: tema,
        duracion: document.getElementById("duracion").value,
        cantidad: document.getElementById("cantidad").value,
        estilo: document.getElementById("estilo").value,
        plataforma: document.getElementById("plataforma").value,
        caracteres: document.getElementById("caracteres").value,
        trozos: document.getElementById("trozos").value
    };

    boton.disabled = true;
    boton.textContent = "GENERANDO...";
    estado.textContent = "La inteligencia artificial está creando tus guiones...";
    resultado.textContent = "Por favor, espera...";

    try {

        const respuesta = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        });

        const textoRespuesta = await respuesta.text();

        let informacion;

        try {
            informacion = JSON.parse(textoRespuesta);
        } catch {
            throw new Error("El servidor respondió de forma inesperada: " + textoRespuesta.slice(0, 300));
        }

        if (!respuesta.ok) {
            throw new Error(informacion.error || informacion.mensaje || "Error del servidor.");
        }

        if (!informacion.texto) {
            throw new Error(informacion.error || "No se recibió ningún guion.");
        }

        resultado.textContent = informacion.texto;
        estado.textContent = "✅ ¡Guion generado correctamente!";

    } catch (error) {

        resultado.textContent = "No se pudo generar el guion.\n\n" + error.message;
        estado.textContent = "❌ Ocurrió un problema.";

    } finally {

        boton.disabled = false;
        boton.textContent = "✨ GENERAR GUION";

    }
}

async function copiar() {

    const texto = document.getElementById("resultado").textContent;

    try {
        await navigator.clipboard.writeText(texto);
        alert("¡Guion copiado!");
    } catch {
        alert("No se pudo copiar automáticamente. Selecciona y copia el texto.");
    }
}

function descargar() {

    const texto = document.getElementById("resultado").textContent;

    if (!texto || texto === "Aquí aparecerán tus guiones...") {
        alert("Primero genera un guion.");
        return;
    }

    const archivo = new Blob([texto], {
        type: "text/plain;charset=utf-8"
    });

    const enlace = document.createElement("a");
    enlace.href = URL.createObjectURL(archivo);
    enlace.download = "mis-guiones.txt";
    enlace.click();

    URL.revokeObjectURL(enlace.href);
}
</script>

</body>
</html>
